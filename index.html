<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luka's sticker book</title>
<style>
:root{
  color-scheme:light;
  --papier:#FBFCFF; --carreau:#DCE4F5; --marge:#F2A7B6;
  --encre:#1F2C5C; --encre-2:#5A6488; --carte:#FFFFFF; --trait:#CFD8EE;
  --fluo:#FFE45C; --fluo-texte:#3A3000;
  --citrouille:#F26B1D; --jungle:#1E8C5A; --ferme:#2F6FD6; --grammaire:#7A4FD6; --svt:#3E8E2E; --physique:#1F77B4; --francais:#B8325A;
  --bon:#1E8C5A; --bon-fond:#DDF5E8; --faux:#C8342B; --faux-fond:#FDE3E1;
  --ombre:0 3px 0 var(--trait);
  --f-main:"Segoe Print","Bradley Hand","Comic Neue","Chalkboard SE",cursive;
  --f-texte:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --papier:#151A2E; --carreau:#212842; --marge:#6B3A4A;
    --encre:#E8ECFA; --encre-2:#A3ABCB; --carte:#1E2440; --trait:#323A5E;
    --fluo:#E8CC3A; --fluo-texte:#2A2200;
    --citrouille:#FF8A45; --jungle:#3FBF84; --ferme:#6E9CF0; --grammaire:#A88BF2; --svt:#7CCB6A; --physique:#5AB0EE; --francais:#F07A9C;
    --bon:#3FBF84; --bon-fond:#173A2C; --faux:#FF7A70; --faux-fond:#43201E;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--encre);font-family:var(--f-texte);font-size:18px;line-height:1.45;
  background-color:var(--papier);
  background-image:
    linear-gradient(90deg,transparent 54px,var(--marge) 54px,var(--marge) 56px,transparent 56px),
    linear-gradient(var(--carreau) 1px,transparent 1px),
    linear-gradient(90deg,var(--carreau) 1px,transparent 1px);
  background-size:100% 100%,24px 24px,24px 24px;
}
#app{max-width:760px;margin:0 auto;padding:28px 20px 60px 76px}
@media (max-width:600px){#app{padding-left:68px;padding-right:12px}}
h1,h2{font-family:var(--f-main);font-weight:700;margin:0;line-height:1.15}
h1{font-size:2.3rem} h2{font-size:1.6rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--fluo);outline-offset:3px;border-radius:12px}
.pile{display:flex;flex-direction:column;gap:18px}
.doux{color:var(--encre-2)}
.fluo{background:linear-gradient(transparent 35%,var(--fluo) 35%,var(--fluo) 90%,transparent 90%);color:inherit;padding:0 4px}
@media (prefers-color-scheme:dark){.fluo{color:var(--fluo-texte)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:12px 20px;border-radius:14px;
  background:var(--c,var(--ferme));color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c,var(--ferme)) 60%,#000);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c,var(--ferme)) 60%,#000)}
.btn.clair{background:var(--carte);color:var(--encre);box-shadow:0 4px 0 var(--trait);border:2px solid var(--trait)}
.retour{font-weight:700;color:var(--encre-2);padding:4px 0;align-self:flex-start}

/* accueil */
.entete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.compteur{font-family:var(--f-main);font-size:1.1rem;background:var(--carte);border:2px dashed var(--trait);border-radius:14px;padding:8px 14px}
.themes{display:grid;gap:16px}
.theme{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-align:left;padding:16px 18px;
  background:var(--carte);border:2px solid var(--trait);border-left:8px solid var(--c);border-radius:16px;box-shadow:var(--ombre)}
.theme .gros{font-size:2.6rem;line-height:1}
.theme h2{font-size:1.45rem}
.barre{height:10px;border-radius:6px;background:var(--trait);overflow:hidden;margin-top:8px}
.barre i{display:block;height:100%;background:var(--c);border-radius:6px}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mode{text-align:left;padding:14px 16px;background:var(--carte);border:2px solid var(--trait);border-radius:14px;box-shadow:var(--ombre)}
.mode b{display:block;font-size:1.05rem}
.mode span{font-size:.9rem;color:var(--encre-2)}
.mode.defi{border-color:var(--c);border-width:3px;grid-column:1/-1}

/* exercice */
.haut{display:flex;justify-content:space-between;align-items:center;gap:10px}
.points{display:flex;gap:5px}
.points i{width:12px;height:12px;border-radius:50%;background:var(--trait)}
.points i.ok{background:var(--bon)} .points i.ko{background:var(--faux)} .points i.ici{outline:2px solid var(--encre);outline-offset:2px}
.question{background:var(--carte);border:2px solid var(--trait);border-radius:18px;padding:26px 20px;text-align:center;box-shadow:var(--ombre)}
.emo{font-size:4.2rem;line-height:1.1}
.consigne{font-size:.95rem;color:var(--encre-2);margin-bottom:6px}
.mot{font-family:var(--f-main);font-size:2rem;font-weight:700;margin-top:6px}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.choix{grid-template-columns:1fr}}
.choix button{padding:14px;border-radius:14px;background:var(--carte);border:2px solid var(--trait);box-shadow:var(--ombre);font-weight:700;font-size:1.1rem}
.choix button.ok{background:var(--bon-fond);border-color:var(--bon)}
.choix button.ko{background:var(--faux-fond);border-color:var(--faux)}
.indice{font-family:ui-monospace,Consolas,monospace;font-size:1.7rem;letter-spacing:.25em;margin-top:8px}
.saisie{display:flex;gap:10px}
.saisie input{flex:1;min-width:0;font:inherit;font-size:1.3rem;padding:12px 14px;border-radius:14px;border:2px solid var(--trait);background:var(--carte);color:var(--encre)}
.retourq{border-radius:14px;padding:12px 16px;font-weight:700}
.retourq.ok{background:var(--bon-fond);color:var(--bon)}
.retourq.ko{background:var(--faux-fond);color:var(--faux)}
.hp{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--fluo);color:var(--fluo-texte)}

/* carte retournable */
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.flip.vu .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--carte);border:2px solid var(--trait);border-radius:18px;box-shadow:var(--ombre);padding:16px}
.face.dos{transform:rotateY(180deg);border-color:var(--c)}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}

/* phrase */
.ligne{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:14px;border:2px dashed var(--trait);background:var(--carte)}
.tuiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tuile{padding:8px 14px;border-radius:10px;background:var(--carte);border:2px solid var(--trait);box-shadow:var(--ombre);font-weight:700}
.ligne .tuile{background:var(--fluo);color:var(--fluo-texte);border-color:transparent}

/* album */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.sticker{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;padding:8px;text-align:center;font-size:.85rem}
.sticker.oui{background:var(--carte);border:2px solid var(--c);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,transparent)}
.sticker.oui:nth-child(3n){transform:rotate(-3deg)} .sticker.oui:nth-child(3n+1){transform:rotate(2deg)}
.sticker.oui .e{font-size:2.6rem;line-height:1}
.sticker.non{border:2px dashed var(--trait);color:var(--encre-2)}
.sticker.non .e{font-size:1.6rem;font-family:var(--f-main)}
.sticker b{font-weight:700}
.gagne{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}70%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.gagne{animation:none}}
.bilan{text-align:center}
.bilan .score{font-family:var(--f-main);font-size:3rem}
.nouveaux{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:2.6rem}
.pied{display:flex;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--trait);padding-top:18px;margin-top:12px}
.pied .btn{font-size:.9rem;padding:9px 14px}
.regle{width:100%;border-collapse:collapse;background:var(--carte);border-radius:14px;overflow:hidden;font-size:.95rem}
.regle th,.regle td{padding:8px 10px;border-bottom:1px solid var(--trait);text-align:left}
.regle thead th{background:color-mix(in srgb,var(--c) 18%,var(--carte))}
.note{background:var(--carte);border:2px solid var(--trait);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px}
.question .phr{font-size:1.5rem;font-weight:700;margin-top:6px}
.question u{text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:4px}
.choix.six{grid-template-columns:repeat(3,1fr)}
.matiere{font-family:var(--f-main);font-size:1.3rem;margin:8px 0 -4px}
.niveaux{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.niveaux .btn{padding:8px 14px;font-size:.95rem}
.banque{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:12px;border-radius:14px;
  background:color-mix(in srgb,var(--c) 14%,var(--papier));border:2px solid var(--c)}
.puce{padding:6px 12px;border-radius:10px;background:var(--carte);border:2px solid var(--trait);box-shadow:var(--ombre);font-weight:700;cursor:grab;font-size:1rem}
.puce.sel{outline:3px solid var(--c);outline-offset:2px}
.texte{background:var(--carte);border:2px solid var(--trait);border-radius:16px;padding:18px 20px;line-height:2.4;font-size:1.08rem;box-shadow:var(--ombre)}
.trou{display:inline-block;min-width:10ch;min-height:1.9em;vertical-align:middle;border-bottom:3px dashed var(--c);border-radius:8px;padding:0 4px;cursor:pointer;line-height:1.6}
.trou.survol{background:color-mix(in srgb,var(--c) 20%,transparent)}
.trou.plein{border-bottom-style:solid}
.trou .puce{box-shadow:none;background:var(--fluo);color:var(--fluo-texte);border-color:transparent;cursor:pointer}
.trou-in{font:inherit;font-weight:700;padding:2px 8px;border:0;border-bottom:3px dashed var(--c);border-radius:8px 8px 0 0;background:color-mix(in srgb,var(--c) 8%,var(--carte));color:var(--encre);max-width:100%}
.trou.ok,.trou-in.ok{background:var(--bon-fond);border-bottom:3px solid var(--bon)}
.trou.ko,.trou-in.ko{background:var(--faux-fond);border-bottom:3px solid var(--faux);text-decoration:line-through}
.trou.ok .puce,.trou.ko .puce{background:transparent;color:inherit}
.corrige{color:var(--bon);font-weight:700;margin-left:6px}
.corrige::before{content:"→ "}
.fig{width:min(380px,100%);margin:6px auto 0}
.fig img{width:100%;border-radius:14px;display:block}
.fig img ~ svg{display:none}
.fig svg,.mini svg{width:100%;height:auto;display:block;border-radius:12px}
.mini{display:block;width:100%}
.pas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem;color:var(--encre-2)}
.pas span{background:var(--carte);border:2px solid var(--c);border-radius:8px;padding:2px 8px;color:var(--encre)}
.cle{overflow-x:auto;background:var(--carte);border:2px solid var(--trait);border-radius:16px;padding:14px;font-size:.88rem;box-shadow:var(--ombre)}
.noeud{display:flex;flex-direction:column;gap:4px}
.noeud>.q{font-weight:700;color:var(--encre-2);font-size:.82rem}
.branches{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--c);padding-left:10px}
.branche{display:flex;align-items:center;gap:8px}
.crit{border:2px solid var(--encre);border-radius:8px;padding:4px 8px;background:var(--papier);min-width:110px;max-width:190px}
.feuille{border:2px solid var(--c);border-radius:8px;padding:4px 10px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,var(--carte));white-space:nowrap}
.fl{color:var(--encre-2);font-weight:700}
.crit.on,.feuille.on{background:var(--fluo);color:var(--fluo-texte);border-color:var(--fluo-texte)}
.fl.on{color:var(--encre)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--encre);color:var(--papier);padding:10px 18px;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<input type="file" id="fichier" accept=".json,application/json" hidden>
<script>
"use strict";
/* ============================================================
   CONTENU — modifier ici pour ajouter des mots ou un thème.
   { en: "mot anglais", fr: "traduction", e: "emoji (facultatif)" }
   ============================================================ */
const THEMES = [
  { id:"an", nom:"Animals", e:"🐘", c:"var(--ferme)",
    mots:[
      {en:"elephant",fr:"éléphant",e:"🐘"},{en:"lion",fr:"lion",e:"🦁"},{en:"monkey",fr:"singe",e:"🐒"},
      {en:"mouse",fr:"souris",e:"🐭"},{en:"frog",fr:"grenouille",e:"🐸"},{en:"snake",fr:"serpent",e:"🐍"},
      {en:"dog",fr:"chien",e:"🐶"},{en:"horse",fr:"cheval",e:"🐴"},{en:"turtle",fr:"tortue",e:"🐢"},
      {en:"cow",fr:"vache",e:"🐮"},{en:"hen",fr:"poule",e:"🐔"},{en:"rooster",fr:"coq",e:"🐓"},
      {en:"fish",fr:"poisson",e:"🐟"},{en:"goldfish",fr:"poisson rouge",e:"🐠"},{en:"cat",fr:"chat",e:"🐱"},
      {en:"goat",fr:"chèvre",e:"🐐"},{en:"squirrel",fr:"écureuil",e:"🐿️"},{en:"rabbit",fr:"lapin",e:"🐰"},
      {en:"bird",fr:"oiseau",e:"🐦"},{en:"chicken",fr:"poulet",e:"🐥"},{en:"duck",fr:"canard",e:"🦆"},
      {en:"pig",fr:"cochon",e:"🐷"},{en:"bear",fr:"ours",e:"🐻"},{en:"hamster",fr:"hamster",e:"🐹"},
      {en:"butterfly",fr:"papillon",e:"🦋"},{en:"sheep",fr:"mouton",e:"🐑"}
    ],
    phrases:["I have a dog","The cat is black","The frog is green"]
  },
  { id:"vb", nom:"Vocabox", e:"🦥", c:"var(--jungle)",
    mots:[
      {en:"sloth",fr:"paresseux",e:"🦥"},{en:"bear",fr:"ours",e:"🐻"},{en:"buffalo",fr:"buffle",e:"🐃"},
      {en:"rabbit",fr:"lapin",e:"🐰"},{en:"monkey",fr:"singe",e:"🐒"},{en:"solve crimes",fr:"résoudre des crimes",e:"🔍"},
      {en:"police officer",fr:"officier de police",e:"👮"},{en:"snake",fr:"serpent",e:"🐍"},{en:"tiger",fr:"tigre",e:"🐯"},
      {en:"panther",fr:"panthère",e:"🐆"},{en:"wolf",fr:"loup",e:"🐺"},{en:"jungle",fr:"jungle",e:"🌴"},
      {en:"want to",fr:"vouloir"},{en:"become",fr:"devenir"},{en:"eat",fr:"manger",e:"🍽️"},
      {en:"protect",fr:"protéger",e:"🛡️"},{en:"about",fr:"à propos de"}
    ],
    phrases:["I want to become a police officer","The wolf wants to eat the rabbit","I want to protect the jungle"]
  }
];
THEMES.push({ id:"tb", nom:"Grammar: to be", e:"✍️", c:"var(--grammaire)", gram:true, maitrise:5, unite:"compétences",
  mots:[
    {en:"amisare", fr:"am, is ou are ?", e:"🧩"}, {en:"contractee", fr:"Forme contractée", e:"✂️"},
    {en:"pronom", fr:"Le bon pronom", e:"👤"}, {en:"negative", fr:"Forme négative", e:"🚫"},
    {en:"question", fr:"Forme interrogative", e:"❓"}, {en:"courte", fr:"Réponses courtes", e:"💬"},
    {en:"ordre", fr:"Mots dans l'ordre", e:"🔀"}, {en:"erreurs", fr:"Chasse aux erreurs", e:"🕵️"},
    {en:"traduction", fr:"Traduis en anglais", e:"🇬🇧"}
  ]});
/* ============================================================
   SVT — textes à trous. Écrire les mots à trouver entre [crochets].
   [mot|autre écriture acceptée] : la 1re forme est celle affichée.
   ============================================================ */
THEMES.push({ id:"sv", nom:"Les espèces", matiere:"SVT", e:"🦆", c:"var(--svt)", trous:true, maitrise:2, unite:"leçons",
  textes:[
    {id:"espece", titre:"Qu'est-ce qu'une espèce ?", e:"🦆",
     texte:`Deux individus font partie de la même espèce si :
– ils partagent les mêmes [caractéristiques physiques] ;
– ils peuvent [se reproduire] et avoir [une descendance fertile].`},
    {id:"diversite", titre:"La diversité dans une espèce", e:"🦒",
     texte:`Cependant, à l'intérieur d'une même espèce, il existe une diversité [intraspécifique] qui est causée par différents phénomènes :
– [la sélection sexuelle], comme chez le canard colvert ;
– [le comportement], comme les chants différents chez le pouillot verdâtre ;
– l'adaptation aux contraintes de [l'environnement] selon les différentes [aires de répartition] de l'espèce, comme pour la girafe ;
– les capacités à se camoufler face à [la pression de prédation|la prédation|la (pression) de prédation], comme celle de la grive musicienne mangeant les escargots des haies.`},
    {id:"retenir", titre:"À retenir", e:"📌",
     texte:`Une même espèce regroupe sous le même [nom], des êtres vivants qui [se ressemblent] et peuvent [se reproduire entre eux] pour donner une [descendance] qui à son tour pourra [se reproduire].`},
    {id:"mots", titre:"Les 4 définitions : le mot", e:"📚",
     texte:`[Une espèce|espèce] : groupe d'êtres vivants qui peuvent se reproduire ensemble et dont la descendance n'est pas stérile.
[Un hybride|hybride] : être vivant issu de la fécondation de deux espèces différentes. Il est le plus souvent stérile.
[Une race|race] : groupe d'animaux domestiques qui appartiennent à la même espèce, mais qui présentent des différences.
[Une famille|famille] : groupe de plusieurs espèces partageant des caractères communs.`},
    {id:"defs", titre:"Les 4 définitions : par cœur", e:"🔍",
     texte:`Une espèce : groupe d'êtres vivants qui peuvent [se reproduire] ensemble et dont la descendance n'est pas [stérile].
Un hybride : être vivant issu de la [fécondation] de deux [espèces différentes]. Il est le plus souvent [stérile].
Une race : groupe d'animaux [domestiques] qui appartiennent à la [même espèce], mais qui présentent des [différences].
Une famille : groupe de plusieurs [espèces] partageant des [caractères communs].`}
  ]});
THEMES.forEach(t => { if (t.trous) t.mots = t.textes.map(x => ({en:x.id, fr:x.titre, e:x.e})); });

/* découpe un texte en morceaux : {txt} ou {ok:[...]} */
function decoupe(texte){
  const parts = []; let n = 0;
  texte.replace(/\[([^\]]+)\]|([^\[]+)/g, (m, trou, txt) => { parts.push(trou ? {i:n++, ok:trou.split("|")} : {txt}); return ""; });
  return parts;
}
const sansAccent = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const normT = s => s.toLowerCase().replace(/[’`]/g,"'").replace(/[()]/g,"").replace(/\s+/g," ").trim();

function ecranSvt(t){
  app.innerHTML = `<div class="pile" style="--c:${t.c}">
    <button class="retour" id="ret">← Accueil</button>
    <div class="entete"><h1>${t.e} ${t.nom}</h1><div class="compteur">⭐ ${acquis(t)} / ${t.mots.length}</div></div>
    <p class="doux">Facile : glisse les mots dans les trous. Difficile : tape-les toi-même. Réussis le niveau difficile sans faute pour gagner l'autocollant.</p>
    <div class="themes">${t.textes.map(x => { const n = etat.m[t.id+":"+x.id] || 0; return `
      <div class="theme" style="--c:${t.c};grid-template-columns:auto 1fr auto">
        <span class="gros" aria-hidden="true">${n>=2 ? x.e : "📝"}</span>
        <span><h2 style="font-size:1.2rem">${esc(x.titre)}</h2><span class="doux">${n>=2 ? "Maîtrisé ⭐" : n===1 ? "Facile réussi, essaie le difficile !" : "À apprendre"}</span></span>
        <span class="niveaux"><button class="btn clair" data-t="${x.id}" data-n="facile">Facile</button><button class="btn" style="--c:${t.c}" data-t="${x.id}" data-n="dur">Difficile</button></span>
      </div>`; }).join("")}
    </div>
    <button class="mode" id="alb"><b>🗂️ Mon album</b><span>Une leçon maîtrisée = un autocollant</span></button>
  </div>`;
  $("#ret").onclick = accueil; $("#alb").onclick = () => album(t);
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => trous(t, t.textes.find(x => x.id===b.dataset.t), b.dataset.n));
}

function trous(t, x, niveau){
  const parts = decoupe(x.texte), blancs = parts.filter(p => p.ok);
  let html = "";
  if (niveau==="facile"){
    const autres = melange(t.textes.filter(y => y!==x).flatMap(y => decoupe(y.texte).filter(p => p.ok).map(p => p.ok[0]))
      .filter(m => !blancs.some(b => normT(b.ok[0])===normT(m))));
    const pioche = melange(blancs.map(b => b.ok[0]).concat([...new Set(autres)].slice(0, 2)));
    html = `<div class="banque" id="banque" aria-label="Mots à placer">${pioche.map((m,n) => `<button class="puce" draggable="true" id="p${n}">${esc(m)}</button>`).join("")}</div>`;
  }
  const corps = parts.map(p => p.txt !== undefined ? esc(p.txt).replace(/\n/g,"<br>")
    : niveau==="facile" ? `<span class="trou" data-i="${p.i}" tabindex="0" role="button" aria-label="Trou ${p.i+1}"></span>`
    : `<input class="trou-in" data-i="${p.i}" autocomplete="off" spellcheck="false" style="width:${Math.max(6, p.ok[0].length+2)}ch" aria-label="Trou ${p.i+1}">`).join("");
  app.innerHTML = `<div class="pile" style="--c:${t.c}">
    <div class="haut"><button class="retour" id="ret">← ${t.nom}</button><span class="hp">${niveau==="facile" ? "Facile" : "Difficile"}</span></div>
    <h2>${x.e} ${esc(x.titre)}</h2>
    <p class="doux">${niveau==="facile" ? "Glisse chaque mot dans le bon trou avec la souris (ou clique sur un mot, puis sur un trou). Attention, il y a des mots en trop !" : "Tape le mot qui manque dans chaque trou. Les majuscules ne comptent pas."}</p>
    ${html}
    <div class="texte">${corps}</div>
    <div class="haut"><span></span><button class="btn" style="--c:${t.c}" id="ok">Vérifier</button></div>
    <div id="fb"></div>
  </div>`;
  $("#ret").onclick = () => ecranTheme(t);

  if (niveau==="facile"){
    const banque = $("#banque"); let choisi = null;
    const place = (puce, trou) => {
      if (trou.firstChild) banque.appendChild(trou.firstChild);
      trou.appendChild(puce); trou.classList.add("plein"); puce.classList.remove("sel"); choisi = null;
    };
    const vide = trou => { if (trou.firstChild){ banque.appendChild(trou.firstChild); trou.classList.remove("plein"); } };
    app.querySelectorAll(".puce").forEach(p => {
      p.ondragstart = e => { e.dataTransfer.setData("text/plain", p.id); e.dataTransfer.effectAllowed = "move"; };
      p.onclick = e => { e.stopPropagation(); if (p.parentElement.classList.contains("trou")) { vide(p.parentElement); return; }
        app.querySelectorAll(".puce.sel").forEach(q => q.classList.remove("sel")); p.classList.add("sel"); choisi = p; };
    });
    app.querySelectorAll(".trou").forEach(tr => {
      tr.ondragover = e => { e.preventDefault(); tr.classList.add("survol"); };
      tr.ondragleave = () => tr.classList.remove("survol");
      tr.ondrop = e => { e.preventDefault(); tr.classList.remove("survol"); const p = document.getElementById(e.dataTransfer.getData("text/plain"));
        if (p){ const ancien = p.parentElement; place(p, tr); if (ancien.classList.contains("trou") && ancien!==tr) ancien.classList.remove("plein"); } };
      const act = () => choisi ? place(choisi, tr) : vide(tr);
      tr.onclick = act; tr.onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } };
    });
    banque.ondragover = e => e.preventDefault();
    banque.ondrop = e => { e.preventDefault(); const p = document.getElementById(e.dataTransfer.getData("text/plain"));
      if (p && p.parentElement.classList.contains("trou")) vide(p.parentElement); };
  } else {
    const ins = [...app.querySelectorAll(".trou-in")]; ins[0].focus();
    ins.forEach((inp, n) => inp.onkeydown = e => { if (e.key==="Enter"){ e.preventDefault(); n < ins.length-1 ? ins[n+1].focus() : $("#ok").click(); } });
  }

  $("#ok").onclick = () => {
    let bons = 0, accents = false;
    const reps = blancs.map(b => {
      const z = app.querySelector(`[data-i="${b.i}"]`);
      return niveau==="facile" ? (z.textContent || "") : z.value;
    });
    if (reps.some(r => !r.trim())) { toast("Il reste des trous à remplir"); return; }
    blancs.forEach((b, n) => {
      const z = app.querySelector(`[data-i="${b.i}"]`), r = normT(reps[n]);
      const art = v => v.replace(/^(le |la |les |l'|un |une |des )/,"");
      let juste = b.ok.some(o => normT(o)===r || (niveau==="dur" && art(normT(o))===art(r)));
      if (!juste && niveau==="dur" && b.ok.some(o => sansAccent(normT(o))===sansAccent(r))) { juste = true; accents = true; }
      z.classList.remove("plein"); z.classList.add(juste ? "ok" : "ko");
      if (juste) bons++;
      else z.insertAdjacentHTML("afterend", `<span class="corrige">${esc(b.ok[0])}</span>`);
      if (niveau==="dur") z.disabled = true;
    });
    app.querySelectorAll(".puce").forEach(p => p.disabled = true);
    $("#ok").remove();
    const parfait = bons===blancs.length, cle = t.id+":"+x.id, avant = etat.m[cle] || 0;
    let gagne = false;
    if (parfait){ const val = niveau==="dur" ? 2 : 1; if (val > avant){ etat.m[cle] = val; sauver(); gagne = val===2; } }
    $("#fb").innerHTML = `<div class="pile">
      <div class="retourq ${parfait?"ok":"ko"}">${bons} / ${blancs.length} ${parfait ? (gagne ? `Bravo, nouvel autocollant : <span class="gagne" style="display:inline-block">${x.e}</span>` : "Bravo, sans faute !") : "Les bonnes réponses sont écrites en vert à côté des erreurs."}
      ${accents ? `<br><span style="font-weight:400">💡 Attention aux accents : c'est compté juste, mais regarde bien l'orthographe dans ta leçon.</span>` : ""}</div>
      <div class="haut" style="justify-content:flex-end;flex-wrap:wrap;gap:10px">
        <button class="btn clair" id="encore">Recommencer</button>
        ${niveau==="facile" && parfait ? `<button class="btn" style="--c:${t.c}" id="dur">Passer au difficile →</button>` : `<button class="btn" style="--c:${t.c}" id="liste">Autres leçons</button>`}
      </div></div>`;
    $("#encore").onclick = () => trous(t, x, niveau);
    if ($("#dur")) $("#dur").onclick = () => trous(t, x, "dur");
    if ($("#liste")) $("#liste").onclick = () => ecranTheme(t);
  };
}

function identifie(s){
  const id = s.qs[s.i], t = s.t;
  if (s.niveau==="facile"){
    let noeud = s.c.racine, erreurs = 0, pas = [];
    const etape = () => {
      app.innerHTML = `<div class="pile" style="--c:${t.c}">${entCle(s)}
        <div class="question"><p class="consigne">Observe bien cet animal et suis la clé « ${esc(s.c.titre)} »</p>${figure(id)}</div>
        ${pas.length ? `<div class="pas">${pas.map(p => `<span>${esc(p)}</span>`).join(" → ")}</div>` : ""}
        <h2 style="font-size:1.3rem">${esc(noeud.q)}</h2>
        <div class="choix">${noeud.opts.map((o,n) => `<button data-o="${n}">${esc(o.t)}</button>`).join("")}</div>
        <div id="fb"></div></div>`;
      $("#ret").onclick = () => ecranTheme(t);
      const bon = chemin(noeud, id)[0];
      app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
        const o = noeud.opts[+b.dataset.o];
        if (o!==bon){ erreurs++; b.classList.add("ko"); b.disabled = true;
          $("#fb").innerHTML = `<div class="retourq ko">Ce n'est pas ça. Regarde encore le dessin et essaie une autre case.</div>`; return; }
        pas.push(o.t);
        if (o.n){ noeud = o.n; etape(); return; }
        app.querySelectorAll("[data-o]").forEach(x => x.disabled = true); b.classList.add("ok");
        const juste = erreurs===0; s.res.push(juste);
        if (juste){ const k2 = t.id+":"+id; if ((etat.m[k2]||0) < 1){ etat.m[k2] = 1; sauver(); } }
        $("#fb").innerHTML = `<div class="pile"><div class="retourq ${juste?"ok":"ko"}">C'est : ${esc(ANIMAUX[id].nom)} ! ${juste ? "Sans erreur, bravo." : "Trouvé, avec un peu d'aide."}</div>
          <button class="btn" style="--c:${t.c};align-self:flex-end" id="next">${s.i===s.qs.length-1 ? "Voir mon score" : "Animal suivant →"}</button></div>`;
        suite(s);
      });
    };
    etape();
  } else {
    app.innerHTML = `<div class="pile" style="--c:${t.c}">${entCle(s)}
      <div class="question"><p class="consigne">Utilise la clé pour trouver le nom de cet animal, puis écris-le</p>${figure(id)}</div>
      <div class="cle" id="cle">${arbre(s.c.racine)}</div>
      <div class="saisie"><input id="rep" autocomplete="off" spellcheck="false" placeholder="Nom de l'animal…" aria-label="Nom de l'animal"><button class="btn" style="--c:${t.c}" id="ok">Valider</button></div>
      <div id="fb"></div></div>`;
    $("#ret").onclick = () => ecranTheme(t);
    const inp = $("#rep"); inp.focus();
    const valide = () => {
      if (!inp.value.trim()) return;
      inp.disabled = true; $("#ok").disabled = true;
      const a = ANIMAUX[id], art = v => v.replace(/^(le |la |les |l'|un |une |des )/,"");
      const r = sansAccent(art(normT(inp.value)));
      const juste = [a.nom].concat(a.alt||[]).some(x => sansAccent(art(normT(x)))===r);
      s.res.push(juste);
      if (juste){ const k2 = t.id+":"+id, av = etat.m[k2]||0; if (av < 2){ etat.m[k2] = 2; sauver(); s.nouveaux.push(id); } }
      $("#cle").innerHTML = arbre(s.c.racine, chemin(s.c.racine, id));
      $("#fb").innerHTML = `<div class="pile"><div class="retourq ${juste?"ok":"ko"}">${juste ? `Bravo ! C'est bien : ${esc(a.nom)}.` : `Non, c'est : ${esc(a.nom)}.`} <span class="doux">Le bon chemin est surligné dans la clé.</span>
        ${juste && s.nouveaux.includes(id) ? `<br>Nouvel autocollant : <span class="mini gagne" style="display:inline-block;width:70px;vertical-align:middle">${DESSINS[id]}</span>` : ""}</div>
        <button class="btn" style="--c:${t.c};align-self:flex-end" id="next">${s.i===s.qs.length-1 ? "Voir mon score" : "Animal suivant →"}</button></div>`;
      suite(s);
    };
    $("#ok").onclick = valide; inp.onkeydown = e => { if (e.key==="Enter") valide(); };
  }
}

function suite(s){
  const n = $("#next"); n.focus();
  n.onclick = () => { s.i++; if (s.i < s.qs.length) return identifie(s);

        ${s.niveau==="facile" ? `<button class="btn" style="--c:${s.t.c}" id="dur">Essayer en difficile</button>` : ""}

}

const PHY = (() => {
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const ETATS = ["solide","liquide","gaz"];

  const EAU = [["la grêle","solide"],["la neige","solide"],["le verglas","solide"],["un glaçon","solide"],["le givre","solide"],
    ["la mer","liquide"],["la pluie","liquide"],["un nuage","liquide"],["la buée","liquide"],["la rosée","liquide"],
    ["la vapeur d'eau","gaz"]];
  const PROPS = [["prend la forme du récipient","liquide et gaz"],["peut être saisi avec les doigts","solide"],["a une forme propre","solide"],
    ["occupe tout l'espace qu'on lui donne","gaz"],["sa surface libre est plane et horizontale","liquide"],["a un volume propre","solide et liquide"],
    ["n'a ni forme propre, ni volume propre","gaz"],["n'a pas de forme propre mais a un volume propre","liquide"]];
  const CHG = {fusion:"solide → liquide", solidification:"liquide → solide", vaporisation:"liquide → gaz", "liquéfaction":"gaz → liquide"};
  const SITU = [["Un glaçon fond dans un verre.","fusion"],["Le verglas fond au soleil.","fusion"],["L'eau gèle dans le congélateur.","solidification"],
    ["Une flaque d'eau gèle pendant la nuit.","solidification"],["L'eau bout dans la casserole.","vaporisation"],["Le linge mouillé sèche sur le fil.","vaporisation"],
    ["De la buée se forme sur une vitre froide.","liquéfaction"],["De petites gouttes apparaissent sur une canette sortie du frigo.","liquéfaction"]];

  /* ---------- courbe de température ---------- */
  function courbe(){
    const type = pick(["fusion","ebullition","solidification"]);
    let pts = [], a, b, palier, avant, pendant, apres;
    if (type==="fusion"){ const T0 = pick([-30,-20,-10]); a = -T0/10; b = a + rnd(3,5); palier = 0;
      for (let t=0;t<=11;t++) pts.push(t<=a ? T0+10*t : t<=b ? 0 : 10*(t-b));
      avant = "solide"; pendant = "solide et liquide"; apres = "liquide"; }
    if (type==="ebullition"){ const T0 = pick([20,40,60]); a = (100-T0)/20; b = Math.min(11, a + rnd(4,6)); palier = 100;
      for (let t=0;t<=b;t++) pts.push(t<=a ? T0+20*t : 100);
      avant = "liquide"; pendant = "liquide et gaz"; apres = null; }
    if (type==="solidification"){ const T0 = pick([20,30,40]); a = T0/10; b = a + rnd(3,4); palier = 0;
      for (let t=0;t<=11;t++) pts.push(t<=a ? T0-10*t : t<=b ? 0 : -10*(t-b));
      avant = "liquide"; pendant = "solide et liquide"; apres = "solide"; }
    const ymin = Math.floor(Math.min(...pts)/10)*10, ymax = Math.ceil(Math.max(...pts)/10)*10 + 10;
    const W=340, H=230, L=44, R=12, T=14, B=34, X = t => L + t*(W-L-R)/11, Y = v => T + (ymax-v)*(H-T-B)/(ymax-ymin);
    let g = "";
    for (let t=0;t<=11;t++) g += `<line x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${H-B}" stroke="#d6dbe6"/><text x="${X(t)}" y="${H-B+16}" font-size="11" text-anchor="middle">${t}</text>`;
    for (let v=ymin; v<=ymax; v+=10) g += `<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="${v===0?"#9aa3b8":"#d6dbe6"}"/><text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end">${v}</text>`;
    const poly = pts.map((v,t) => `${X(t)},${Y(v)}`).join(" ");
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:min(460px,100%);background:#fff;border-radius:12px;color:#222;font-family:system-ui" role="img" aria-label="Courbe de température">
      ${g}<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#222" stroke-width="1.5"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#222" stroke-width="1.5"/>
      <polyline points="${poly}" fill="none" stroke="#C0392B" stroke-width="2.5"/>${pts.map((v,t) => `<circle cx="${X(t)}" cy="${Y(v)}" r="3.2" fill="#222"/>`).join("")}
      <text x="${L}" y="10" font-size="11" font-weight="700">Température (°C)</text><text x="${W-R}" y="${H-4}" font-size="11" font-weight="700" text-anchor="end">Temps (min)</text></svg>`;
    const intro = type==="fusion" ? "On chauffe de la glace et on relève sa température chaque minute."
      : type==="ebullition" ? "On chauffe de l'eau liquide jusqu'à ébullition et on relève sa température chaque minute."
      : "On refroidit de l'eau liquide et on relève sa température chaque minute.";
    const nomChg = type==="fusion" ? "fusion" : type==="ebullition" ? "vaporisation" : "solidification";
    return {pts, a, b, palier, avant, pendant, apres, html:`<p style="font-size:1rem;font-weight:400">${intro}</p>${svg}`, nomChg};
  }
  const ETATS2 = ["solide","liquide","gaz","solide et liquide","liquide et gaz"];

  /* ---------- récipients penchés ---------- */
  function recipients(){
    const bon = rnd(0,2), lettres = ["A","B","C"];
    const fig = [0,1,2].map(i => {
      const ang = pick([-22,-15,15,22]), id = "clip"+Math.random().toString(36).slice(2,8);
      const pente = i===bon ? 0 : (i===(bon+1)%3 ? Math.tan(ang*Math.PI/180) : -Math.tan(ang*Math.PI/180)*0.8);
      const forme = `<g transform="rotate(${ang})"><path d="M-26 -50 L-26 40 Q-26 48 -18 48 L18 48 Q26 48 26 40 L26 -50" fill="none" stroke="#222" stroke-width="2.5"/></g>`;

    mesures(){

      if (q==="volume") return {kind:"texte", consigne:"Calcule (réponds en cm³)", html:`Volume d'un cube de ${c} cm de côté ?`, nombre:c*c*c, ok:[String(c*c*c)], rappel:`${c} × ${c} × ${c} = ${c*c*c} cm³`, astuce:"Volume = côté × côté × côté"};
      const [m,u] = pick([["un périmètre","cm"],["une aire","cm²"],["un volume","cm³"]]);

    }
  };
  return {GEN};
})();

const GRAM = (() => {
  const V = {I:"am",you:"are",he:"is",she:"is",it:"is",we:"are",they:"are"};
  const CT = {am:"'m",is:"'s",are:"'re"};
  /* k : p = personne, a = animal/créature, o = objet */
  const SUJ = [
    {s:"I",p:"I",k:"p",pron:1},{s:"you",p:"you",k:"p",pron:1},{s:"he",p:"he",k:"p",pron:1},
    {s:"she",p:"she",k:"p",pron:1},{s:"it",p:"it",k:"o",pron:1},{s:"we",p:"we",k:"p",pron:1},{s:"they",p:"they",k:"p",pron:1},
    {s:"my grandma",p:"she",k:"p"},{s:"my uncle",p:"he",k:"p"},{s:"Leo",p:"he",k:"p",nom:1},{s:"Chloé",p:"she",k:"p",nom:1},
    {s:"my sister",p:"she",k:"p"},{s:"my brother",p:"he",k:"p"},{s:"the monkey",p:"it",k:"a"},{s:"the frog",p:"it",k:"a"},
    {s:"the bear",p:"it",k:"a"},{s:"the sloth",p:"it",k:"a"},{s:"my cousins",p:"they",k:"p"},{s:"Max and Nina",p:"they",k:"p",nom:1},
    {s:"the rabbits",p:"they",k:"a"},{s:"my dad and I",p:"we",k:"p"},{s:"you and Lily",p:"you",k:"p"},
    {s:"the ball",p:"it",k:"o"},{s:"the house",p:"it",k:"o"},{s:"my bag",p:"it",k:"o"},{s:"the pencils",p:"they",k:"o"},{s:"the book",p:"it",k:"o"}
  ];
  const COMP = [
    {c:"happy",k:"pa"},{c:"tired",k:"pa"},{c:"hungry",k:"pa"},{c:"sad",k:"pa"},{c:"scared",k:"pa"},{c:"funny",k:"pa"},
    {c:"late",k:"p"},{c:"at school",k:"p"},{c:"ready",k:"p"},{c:"at home",k:"pa"},
    {c:"in the garden",k:"pao"},{c:"in the kitchen",k:"pao"},{c:"in my bedroom",k:"pao"},
    {c:"big",k:"ao"},{c:"small",k:"ao"},{c:"old",k:"ao"},{c:"black",k:"ao"},{c:"new",k:"o"},{c:"on the table",k:"o"}
  ];
  const DEJA_FAIT = new Set(["i am eleven years old","my mum is a nurse","we are in the classroom","the cat is under the table",
    "you are my best friend","tom and lucy are english","it is cold today","my brothers are at school","i am hungry",
    "the books are on the desk","my sister is tall","paul and i are friends","the dog is black","emma and sophie are sisters",
    "my dad is in the garden","you and tom are late","i am french","she is happy","they are at home","the film is boring",
    "we are in london","you are tired","he is spanish","you are ready","the shops are open","it is your bag",
    "lisa is in your class","they are cousins","sam is my best friend","we are tired","you are hungry","the house is big",
    "she is your teacher","she is my sister","i am sad","they are happy","we are in the park","you are late","he is tall",
    "you are english","they are in the garden","she is late","you are eleven","the dog is hungry","i am late","your sister is at home"]);
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const pr = p => p==="I" ? "I" : p;

  function modele(filtre){
    for (let n=0; n<300; n++){
      const s = pick(SUJ), c = pick(COMP.filter(x => x.k.includes(s.k)));
      const m = {...s, c:c.c, v:V[s.p]};
      if (filtre && !filtre(m)) continue;
      if (DEJA_FAIT.has(norm(`${m.s} ${m.v} ${m.c}`))) continue;
      return m;
    }
  }
  /* toutes les bonnes façons d'écrire la phrase (la 1re est celle qu'on affiche) */
  function aff(m){ const r=[`${m.s} ${m.v} ${m.c}`]; if (m.pron) r.push(`${m.s}${CT[m.v]} ${m.c}`); return r.map(cap); }
  function neg(m){
    const r = m.v==="am" ? [`I'm not ${m.c}`, `I am not ${m.c}`]
      : [`${m.s} ${m.v}n't ${m.c}`, `${m.s} ${m.v} not ${m.c}`].concat(m.pron ? [`${m.s}${CT[m.v]} not ${m.c}`] : []);
    return r.map(cap);
  }
  const ques = m => [`${cap(m.v)} ${m.s} ${m.c}?`];
  function courte(m, oui){
    const ap = m.s==="you" ? "I" : m.s==="I" ? "you" : m.p, v = V[ap];
    if (oui) return [`Yes, ${pr(ap)} ${v}.`];
    if (v==="am") return ["No, I'm not.","No, I am not."];
    return [`No, ${ap} ${v}n't.`, `No, ${ap} ${v} not.`, `No, ${ap}${CT[v]} not.`];
  }
  const autreV = v => pick(["am","is","are"].filter(x => x!==v));

  const TRAD = [
    {fr:"Je suis content.", s:"I",p:"I",pron:1,c:"happy",f:"aff"},
    {fr:"Le singe n'est pas dans la cuisine.", s:"the monkey",p:"it",c:"in the kitchen",f:"neg"},
    {fr:"Sommes-nous en retard ?", s:"we",p:"we",pron:1,c:"late",f:"q"},
    {fr:"Mes cousins sont à l'école.", s:"my cousins",p:"they",c:"at school",f:"aff"},
    {fr:"Il n'est pas fatigué.", s:"he",p:"he",pron:1,c:"tired",f:"neg"},
    {fr:"Est-elle à la maison ?", s:"she",p:"she",pron:1,c:"at home",f:"q"},
    {fr:"Le ballon est petit.", s:"the ball",p:"it",c:"small",f:"aff"},
    {fr:"Tu n'es pas drôle !", s:"you",p:"you",pron:1,c:"funny",f:"neg"},
    {fr:"Les lapins sont noirs.", s:"the rabbits",p:"they",c:"black",f:"aff"},
    {fr:"Es-tu prêt ?", s:"you",p:"you",pron:1,c:"ready",f:"q"},
    {fr:"Je ne suis pas en retard.", s:"I",p:"I",pron:1,c:"late",f:"neg"},
    {fr:"Le paresseux est dans le jardin.", s:"the sloth",p:"it",c:"in the garden",f:"aff"},
    {fr:"Ma sœur a peur.", s:"my sister",p:"she",c:"scared",f:"aff"},
    {fr:"Est-ce que les crayons sont sur la table ?", s:"the pencils",p:"they",c:"on the table",f:"q"},
    {fr:"Nous ne sommes pas dans ma chambre.", s:"we",p:"we",pron:1,c:"in my bedroom",f:"neg"}
  ].map(t => ({...t, v:V[t.p]}));

  const souligne = (m, phrase) => phrase.replace(cap(m.s), `<u>${esc(cap(m.s))}</u>`);

  const GEN = {
    amisare(){
      const m = modele();
      return {kind:"qcm", consigne:"am, is ou are ?", html:`${esc(cap(m.s))} ____ ${esc(m.c)}.`,
        choix:["am","is","are"], bonne:m.v, rappel:aff(m)[0]+".", astuce:"I → am · he / she / it → is · you / we / they → are"};
    },
    contractee(){
      const p = pick(["I","you","he","she","it","we","they"]), v = V[p], n = Math.random()<.5, versCourt = Math.random()<.6;
      const long = `${p} ${v}${n?" not":""}`;
      const courts = n ? (v==="am" ? ["I'm not"] : [`${p} ${v}n't`, `${p}${CT[v]} not`]) : [`${p}${CT[v]}`];
      if (versCourt) return {kind:"texte", consigne:"Écris la forme contractée", html:esc(long), ok:courts, rappel:courts.join(" ou ")};
      const c = pick(courts);
      return {kind:"texte", consigne:"Écris la forme longue (sans apostrophe)", html:esc(c), ok:[long], rappel:long};
    },
    pronom(){
      const m = modele(m => !m.pron);
      return {kind:"qcm", consigne:"Quel pronom remplace le groupe souligné ?", html:souligne(m, esc(aff(m)[0]))+".",
        choix:["he","she","it","we","you","they"], bonne:m.p, rappel:`${cap(m.p)} ${m.v} ${m.c}.`,
        astuce:"Une chose ou un animal → it · plusieurs → they · moi + quelqu'un → we"};
    },
    negative(){
      const m = modele(); const ok = neg(m);
      return {kind:"texte", consigne:"Mets la phrase à la forme négative (forme contractée)", html:esc(aff(m)[0])+".", ok, rappel:ok[0]+".",
        astuce:"is not → isn't · are not → aren't · am not → 'm not"};
    },
    question(){
      const m = modele(); const ok = ques(m);
      return {kind:"texte", consigne:"Transforme en question. N'oublie pas le point d'interrogation !", html:esc(aff(m)[0])+".", ok, rappel:ok[0], q:true,
        astuce:"Pour poser la question, on met le verbe devant : She is → Is she…?"};
    },
    courte(){
      const m = modele(m => m.p!=="we" && m.s!=="you and Lily"), oui = Math.random()<.5, ok = courte(m, oui);
      return {kind:"texte", consigne:`Réponds avec une réponse courte (${oui?"yes":"no"})`, html:esc(ques(m)[0])+` <span class="doux">(${oui?"yes":"no"})</span>`,
        ok, rappel:ok[0], astuce:"Après Yes, on ne contracte jamais : « Yes, I am. »"};
    },
    ordre(){
      const m = modele(), f = pick(["aff","neg","q"]);
      let phrase = f==="aff" ? aff(m)[0] : f==="neg" ? neg(m)[0] : ques(m)[0];
      const mots = phrase.replace("?"," ?").split(" ");
      if (mots[0]!=="I" && !m.nom) mots[0] = mots[0].toLowerCase();
      return {kind:"ordre", consigne:"Remets les mots dans l'ordre", mots, cible:mots.join(" "), rappel:phrase+(f==="q"?"":".")};
    },
    erreurs(){
      const m = modele(), types = ["verbe","not","qverbe","yes"]; if (m.p==="I") types.push("amnt");
      const t = pick(types);
      let faux, ok, astuce;
      if (t==="verbe"){ faux = `${cap(m.s)} ${autreV(m.v)} ${m.c}.`; ok = aff(m); astuce = "Vérifie l'accord : am, is ou are ?"; }
      if (t==="not"){ faux = `${cap(m.s)} not ${m.v} ${m.c}.`; ok = neg(m); astuce = "not se place après le verbe : is not, are not…"; }
      if (t==="qverbe"){ faux = `${cap(autreV(m.v))} ${m.s} ${m.c}?`; ok = ques(m); astuce = "Vérifie l'accord : am, is ou are ?"; }
      if (t==="amnt"){ faux = `I amn't ${m.c}.`; ok = neg(m); astuce = "« amn't » n'existe pas : on écrit I'm not."; }
      if (t==="yes"){ const ap = m.s==="you" ? "I" : m.s==="I" ? "you" : m.p, v = V[ap];
        faux = `${cap(ques(m)[0])} Yes, ${pr(ap)}${CT[v]}.`; ok = [`${ques(m)[0]} Yes, ${pr(ap)} ${v}.`, `Yes, ${pr(ap)} ${v}.`];
        astuce = "Après Yes, on ne contracte jamais."; }
      return {kind:"texte", consigne:"Il y a une erreur : réécris la phrase correctement", html:esc(faux), ok, rappel:ok[0]+(/[.?]$/.test(ok[0])?"":"."), astuce};
    },
    traduction(){
      const t = pick(TRAD); const ok = t.f==="aff" ? aff(t) : t.f==="neg" ? neg(t) : ques(t);
      return {kind:"texte", consigne:"Traduis en anglais", html:esc(t.fr), ok, rappel:ok[0]+(t.f==="q"?"":".")};
    }
  };
  return { GEN };
})();

/* ---------- sauvegarde ---------- */
let etat = { m:{} };     // m["an:dog"] = nombre de bonnes réponses (0..3)
try { const s = JSON.parse(localStorage.getItem(CLE) || "null"); if (s && s.m) etat = s; } catch(e) {}
function sauver(){ try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch(e) {} }
const k = (t,w) => t.id + ":" + w.en;
const niv = (t,w) => etat.m[k(t,w)] || 0;
const seuil = t => t.maitrise || MAITRISE;
const acquis = t => t.mots.filter(w => niv(t,w) >= seuil(t)).length;
const totalAcquis = () => THEMES.reduce((s,t) => s + acquis(t), 0);
const totalMots = () => THEMES.reduce((s,t) => s + t.mots.length, 0);

/* ---------- outils ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const melange = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[’`]/g,"'").replace(/[.!?,"]/g,"").replace(/\s+/g," ").trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ---------- voix anglaise ---------- */
let voix = null;
const parle = "speechSynthesis" in window;
function chercheVoix(){ if(!parle) return; const v = speechSynthesis.getVoices();
  voix = v.find(x=>/en-GB/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }
if (parle){ chercheVoix(); speechSynthesis.onvoiceschanged = chercheVoix; }
function dire(t){ if(!parle) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);
  u.lang="en-GB"; if(voix) u.voice=voix; u.rate=.85; speechSynthesis.speak(u); }
const boutonSon = t => parle ? `<button class="hp" data-dire="${esc(t)}" aria-label="Écouter ${esc(t)}">🔊 Écouter</button>` : "";
document.addEventListener("click", e => { const b=e.target.closest("[data-dire]"); if(b){ e.stopPropagation(); dire(b.dataset.dire); } });

/* ---------- choix des mots : les moins connus d'abord ---------- */
function tirage(t, n){
  const tri = melange(t.mots).sort((a,b) => niv(t,a) - niv(t,b));
  const pris = tri.slice(0, Math.min(n, tri.length));
  while (pris.length < n) pris.push(t.mots[Math.floor(Math.random()*t.mots.length)]);
  return melange(pris);
}
function intrus(t, w, champ){
  const autres = melange(t.mots.filter(x => x[champ] !== w[champ])).slice(0,3);
  return melange([w, ...autres]);
}

/* ---------- séries notées ---------- */
function serie(t, mode){
  if (t.gram){
    const comp = mode==="defi" ? melange(t.mots) : [t.mots.find(w => w.en===mode)];
    const qs = Array.from({length:NB_Q}, (_,n) => { const w = comp[n % comp.length]; return {w, g:(t.gen||GRAM.GEN)[w.en]()}; });
    return question({ t, mode, qs: mode==="defi" ? melange(qs) : qs, i:0, res:[], nouveaux:[] });
  }
  const types = mode==="defi" ? ["choix","sens","ecrire"].concat(parle?["ecoute"]:[]) : [mode];
  let qs;
  if (mode==="phrase") qs = melange(t.phrases).map(p => ({type:"phrase", p}));
  else qs = tirage(t, NB_Q).map((w,n) => ({type: types[n % types.length], w}));
  if (mode==="defi"){ qs = melange(qs); const p = melange(t.phrases)[0]; qs.splice(NB_Q-1, 1, {type:"phrase", p}); }
  const s = { t, mode, qs, i:0, res:[], nouveaux:[] };
  question(s);
}

function entete(s){
  return `<div class="haut"><button class="retour" id="ret">← ${s.t.nom}</button>
    <div class="points">${s.qs.map((q,n) => `<i class="${n<s.res.length ? (s.res[n]?"ok":"ko") : (n===s.i?"ici":"")}"></i>`).join("")}</div></div>`;
}

function question(s){
  if (s.t.gram) return questionGram(s);
  const q = s.qs[s.i], w = q.w, t = s.t;
  let corps = "";
  if (q.type==="choix"){
    const ops = intrus(t, w, "en");
    corps = `<div class="question"><p class="consigne">Comment dit-on en anglais ?</p><div class="emo">${w.e||""}</div><div class="mot">${esc(w.fr)}</div></div>
      <div class="choix">${ops.map(o => `<button data-v="${esc(o.en)}">${esc(o.en)}</button>`).join("")}</div>`;
  } else if (q.type==="sens"){
    const ops = intrus(t, w, "fr");
    corps = `<div class="question"><p class="consigne">Que veut dire ce mot ?</p><div class="mot">${esc(w.en)}</div>${boutonSon(w.en)}</div>
      <div class="choix">${ops.map(o => `<button data-v="${esc(o.fr)}">${esc(o.fr)}</button>`).join("")}</div>`;
  } else if (q.type==="ecrire" || q.type==="ecoute"){
    const indice = q.type==="ecrire" ? lettresCachees(w.en) : "";
    corps = `<div class="question">${q.type==="ecrire"
        ? `<p class="consigne">Écris le mot anglais en entier</p><div class="emo">${w.e||""}</div><div class="mot">${esc(w.fr)}</div><div class="indice" aria-label="Indice">${indice}</div>`
        : `<p class="consigne">Écoute bien, puis écris le mot</p><div class="emo">🎧</div>${boutonSon(w.en)}`}</div>
      <div class="saisie"><input id="rep" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris ici…" aria-label="Ta réponse"><button class="btn" style="--c:${t.c}" id="ok">Valider</button></div>`;
  } else {
    corps = `<div class="question"><p class="consigne">Clique sur les mots pour remettre la phrase dans l'ordre</p>${boutonSon(q.p)}</div>
      <div class="ligne" id="ligne" aria-label="Ta phrase"></div>
      <div class="tuiles" id="tuiles">${melange(q.p.split(" ").map((m,n)=>({m,n}))).map(o => `<button class="tuile" data-n="${o.n}">${esc(o.m)}</button>`).join("")}</div>
      <button class="btn" style="--c:${t.c}; align-self:center" id="ok">Valider</button>`;
  }
  app.innerHTML = `<div class="pile" style="--c:${t.c}">${entete(s)}${corps}<div id="fb"></div></div>`;
  $("#ret").onclick = () => ecranTheme(t);

  if (q.type==="choix" || q.type==="sens"){
    const bonne = q.type==="choix" ? w.en : w.fr;
    app.querySelectorAll(".choix button").forEach(b => b.onclick = () => {
      app.querySelectorAll(".choix button").forEach(x => { x.disabled = true; if (x.dataset.v===bonne) x.classList.add("ok"); });
      const juste = b.dataset.v === bonne; if (!juste) b.classList.add("ko");
      fin(s, juste, `${esc(w.en)} = ${esc(w.fr)}`, w.en);
    });
  } else if (q.type==="ecrire" || q.type==="ecoute"){
    const inp = $("#rep"); inp.focus();
    if (q.type==="ecoute") setTimeout(() => dire(w.en), 300);
    const valide = () => { if (!inp.value.trim()) return; inp.disabled = true; $("#ok").disabled = true;
      fin(s, norm(inp.value)===norm(w.en), `${esc(w.en)} = ${esc(w.fr)}`, w.en); };
    $("#ok").onclick = valide; inp.onkeydown = e => { if (e.key==="Enter") valide(); };
  } else {
    const ligne = $("#ligne"), tuiles = $("#tuiles");
    [ligne, tuiles].forEach(z => z.onclick = e => { const b = e.target.closest(".tuile"); if (!b || b.disabled) return;
      (b.parentElement===tuiles ? ligne : tuiles).appendChild(b); });
    $("#ok").onclick = () => {
      const rep = [...ligne.querySelectorAll(".tuile")].map(b => b.textContent).join(" ");
      if (!rep) return;
      app.querySelectorAll(".tuile").forEach(b => b.disabled = true); $("#ok").disabled = true;
      fin(s, norm(rep)===norm(q.p), esc(q.p), q.p);
    };
  }
}

function lettresCachees(mot){
  let lettres = [...mot].map((c,n) => /[a-z]/i.test(c) ? n : -1).filter(n => n>0);
  const cache = new Set(melange(lettres).slice(0, Math.max(1, Math.round(lettres.length*0.45))));
  return [...mot].map((c,n) => c===" " ? "&nbsp;" : cache.has(n) ? "_" : esc(c.toUpperCase())).join(" ");
}

function fin(s, juste, rappel, aDire, astuce){
  const q = s.qs[s.i];
  s.res.push(juste);
  if (juste && q.w){
    const cle = k(s.t, q.w), avant = etat.m[cle] || 0;
    const max = seuil(s.t);
    etat.m[cle] = Math.min(max, avant + 1); sauver();
    if (avant < max && etat.m[cle] === max) s.nouveaux.push(q.w);
  }
  if (!juste && !s.t.muet) dire(aDire);
  const gagne = juste && q.w && s.nouveaux.includes(q.w) && s.nouveaux[s.nouveaux.length-1]===q.w;
  $("#fb").innerHTML = `<div class="pile">
    <div class="retourq ${juste?"ok":"ko"}">${juste ? (gagne ? `Bravo ! Nouvel autocollant : <span class="gagne" style="display:inline-block">${q.w.e||"⭐"}</span>` : "Bravo !") : "Pas tout à fait. La bonne réponse :"} <span class="doux">${rappel}</span>${!juste && astuce ? `<br><span style="font-weight:400">💡 ${esc(astuce)}</span>` : ""}</div>
    <button class="btn" style="--c:${s.t.c}; align-self:flex-end" id="next">${s.i===s.qs.length-1 ? "Voir mon score" : "Question suivante →"}</button></div>`;
  const n = $("#next"); n.focus();
  n.onclick = () => { s.i++; s.i < s.qs.length ? question(s) : bilan(s); };
}

function bilan(s){
  const bons = s.res.filter(Boolean).length, tot = s.res.length;
  const msg = bons===tot ? "Parfait, rien à redire !" : bons >= tot*0.7 ? "Très bien joué !" : bons >= tot*0.4 ? "Pas mal, encore un petit effort." : "On recommence ? Tu peux réviser avec les cartes.";
  app.innerHTML = `<div class="pile bilan" style="--c:${s.t.c}">
    <h2>${msg}</h2><div class="score">${bons} / ${tot}</div>
    ${s.nouveaux.length ? `<p>Nouveaux autocollants :</p><div class="nouveaux">${s.nouveaux.map(w => `<span class="gagne" title="${esc(w.en)}">${w.e||"⭐"}</span>`).join("")}</div>` : ""}
    <div class="haut" style="justify-content:center;flex-wrap:wrap">
      <button class="btn clair" id="th">← ${s.t.nom}</button>
      <button class="btn" style="--c:${s.t.c}" id="enc">Rejouer</button>
    </div></div>`;
  $("#th").onclick = () => ecranTheme(s.t); $("#enc").onclick = () => serie(s.t, s.mode);
}

function questionGram(s){
  const q = s.qs[s.i], g = q.g, t = s.t;
  let corps = `<div class="question"><p class="consigne">${esc(g.consigne)}</p>${g.kind!=="ordre" ? `<div class="phr">${g.html}</div>` : ""}</div>`;
  if (g.kind==="qcm") corps += `<div class="choix ${g.choix.length>4?"six":""}">${g.choix.map(c => `<button data-v="${c}">${c}</button>`).join("")}</div>`;
  if (g.kind==="texte") corps += `<div class="saisie"><input id="rep" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris ici…" aria-label="Ta réponse"><button class="btn" style="--c:${t.c}" id="ok">Valider</button></div>`;
  if (g.kind==="ordre") corps += `<div class="ligne" id="ligne" aria-label="Ta phrase"></div>
    <div class="tuiles" id="tuiles">${melange(g.mots.map((m,n)=>({m,n}))).map(o => `<button class="tuile">${esc(o.m)}</button>`).join("")}</div>
    <button class="btn" style="--c:${t.c};align-self:center" id="ok">Valider</button>`;
  app.innerHTML = `<div class="pile" style="--c:${t.c}">${entete(s)}${corps}<div id="fb"></div></div>`;
  $("#ret").onclick = () => ecranTheme(t);

  if (g.kind==="qcm"){
    app.querySelectorAll(".choix button").forEach(b => b.onclick = () => {
      app.querySelectorAll(".choix button").forEach(x => { x.disabled = true; if (x.dataset.v===g.bonne) x.classList.add("ok"); });
      const juste = b.dataset.v===g.bonne; if (!juste) b.classList.add("ko");
      fin(s, juste, esc(g.rappel), g.rappel, g.astuce);
    });
  }
  if (g.kind==="texte"){
    const inp = $("#rep"); inp.focus();
    const valide = () => {
      const v = inp.value.trim(); if (!v) return;
      inp.disabled = true; $("#ok").disabled = true;
      const bon = g.nombre!==undefined ? Math.abs(parseFloat(v.replace(",",".").replace(/\s/g,"")) - g.nombre) < 1e-9 : g.ok.some(o => norm(o)===norm(v));
      if (bon && g.q && !/\?\s*$/.test(v)) return fin(s, false, esc(g.rappel), g.rappel, "Presque ! Il manquait le point d'interrogation.");
      fin(s, bon, esc(g.rappel), g.rappel, g.astuce);
    };
    $("#ok").onclick = valide; inp.onkeydown = e => { if (e.key==="Enter") valide(); };
  }
  if (g.kind==="ordre"){
    const ligne = $("#ligne"), tuiles = $("#tuiles");
    [ligne, tuiles].forEach(z => z.onclick = e => { const b = e.target.closest(".tuile"); if (!b || b.disabled) return;
      (b.parentElement===tuiles ? ligne : tuiles).appendChild(b); });
    $("#ok").onclick = () => {
      const rep = [...ligne.querySelectorAll(".tuile")].map(b => b.textContent).join(" ");
      if (!rep) return;
      app.querySelectorAll(".tuile").forEach(b => b.disabled = true); $("#ok").disabled = true;
      fin(s, rep.toLowerCase()===g.cible.toLowerCase(), esc(g.rappel), g.rappel);
    };
  }
}

/* ---------- album ---------- */
function album(t){
  app.innerHTML = `<div class="pile" style="--c:${t.c}">
    <button class="retour" id="ret">← ${t.nom}</button>
    <div class="entete"><h1>Mon album ${t.e}</h1><div class="compteur">⭐ ${acquis(t)} / ${t.mots.length}</div></div>
    <p class="doux">${t.cle ? "Une case se remplit quand tu trouves le nom de l'animal au niveau difficile." : t.trous ? "Une case se remplit quand tu réussis la leçon au niveau difficile sans faute." : `Les cases en pointillés se remplissent quand tu réponds juste ${seuil(t)} fois${t.gram?" à ce type d'exercice":" au mot"}.`}</p>
    <div class="album">${t.mots.map(w => { const n = niv(t,w), max = seuil(t); return n >= max
      ? `<div class="sticker oui">${t.cle ? `<span class="mini">${DESSINS[w.en]}</span>` : `<span class="e">${w.e||"⭐"}</span>`}<b>${esc(t.gram||t.trous||t.cle ? w.fr : w.en)}</b>${t.gram||t.trous||t.cle ? "" : `<span class="doux">${esc(w.fr)}</span>`}</div>`
      : `<div class="sticker non"><span class="e">?</span><span>${esc(w.fr)}</span><span aria-label="${n} sur ${max}">${"●".repeat(n)}${"○".repeat(max-n)}</span></div>`; }).join("")}
    </div></div>`;
  $("#ret").onclick = () => ecranTheme(t);
}

/* ---------- export / import ---------- */
function exporter(){
  const blob = new Blob([JSON.stringify(etat, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "progression-anglais-luka-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove(); toast("Progression sauvegardée ✔");
}
$("#fichier").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.m) throw 0; etat = d; sauver(); accueil(); toast("Progression restaurée ✔"); }
    catch(err){ toast("Ce fichier n'est pas une sauvegarde valide"); } };
  r.readAsText(f); e.target.value = "";
};

accueil();
