   La mécanique (exercices, autocollants) est dans ../commun/moteur.js
   Leçons à trous : [mot|autre écriture acceptée], la 1re forme est affichée.
   Quiz : [question, bonne réponse (ou liste de bonnes), [mauvaises réponses]]
   ============================================================ */
const pick = a => a[Math.floor(Math.random()*a.length)];
function quiz(BANQUE){
  const gen = cle => () => {
    const [q, b, f] = pick(BANQUE[cle]), bonne = Array.isArray(b) ? pick(b) : b;
    return {kind:"qcm", consigne:"Choisis la bonne réponse", html:esc(q), choix:melange([bonne, ...f]), bonne, rappel:`${q} → ${bonne}`};
  };
  return Object.fromEntries(Object.keys(BANQUE).map(k => [k, gen(k)]));
}

/* ---------- la carte des métropoles (MONDE est dans carte-monde.js) ---------- */
const CARTE = (() => {
  const villes = Object.keys(MONDE.P);
  const ZOOM = [488, 98, 150, 80];               // cadre de l'Europe agrandi
  const fond = d => `<rect width="${MONDE.W}" height="${MONDE.H}" fill="#DCEFFA"/><path d="${d}" fill="#F3EAD2" stroke="#8A9BB0" stroke-width="1"/>`;
  const svg = (contenu, label) => `<svg viewBox="0 0 ${MONDE.W} ${MONDE.H}" style="width:100%;max-width:640px;border-radius:12px;display:block;margin:8px auto 0" role="img" aria-label="${label}">${contenu}</svg>`;
  const point = (v, rouge) => { const [x,y] = MONDE.P[v];
    return rouge ? `<circle cx="${x}" cy="${y}" r="14" fill="#C0392B" opacity=".25"/><circle cx="${x}" cy="${y}" r="7" fill="#C0392B" stroke="#fff" stroke-width="2"/>`
                 : `<circle cx="${x}" cy="${y}" r="4.5" fill="#33415C"/>`; };
  function qui(){
    const v = pick(villes);
    const [zx,zy,zw,zh] = ZOOM, k = 1.7, iw = zw*k, ih = zh*k, ix = 12, iy = MONDE.H - ih - 12;
    const encart = `<rect x="${zx}" y="${zy}" width="${zw}" height="${zh}" fill="none" stroke="#33415C" stroke-dasharray="5 4"/>
      <svg x="${ix}" y="${iy}" width="${iw}" height="${ih}" viewBox="${zx} ${zy} ${zw} ${zh}">${fond(MONDE.d)}
        ${villes.map(w => { const [x,y] = MONDE.P[w]; return w===v ? `<circle cx="${x}" cy="${y}" r="4" fill="#C0392B" stroke="#fff" stroke-width="1.2"/>` : `<circle cx="${x}" cy="${y}" r="2.2" fill="#33415C"/>`; }).join("")}</svg>
      <rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" fill="none" stroke="#33415C" stroke-width="2"/>
      <text x="${ix+8}" y="${iy+22}" font-size="15" font-family="system-ui" fill="#33415C">Zoom sur l'Europe</text>`;
    const html = svg(fond(MONDE.d) + villes.filter(w => w!==v).map(w => point(w)).join("") + point(v, true) + encart, "Carte du monde avec une métropole en rouge");
    return {kind:"qcm", consigne:"Quelle métropole est indiquée par le point rouge ?", html, choix:melange([v, ...melange(villes.filter(w => w!==v)).slice(0,3)]), bonne:v, rappel:`Le point rouge : ${v}`};
  }
  function ou(){
    const pris = [];
    for (const v of melange(villes)){ const [x,y] = MONDE.P[v];
      if (pris.every(w => { const [a,b] = MONDE.P[w]; return Math.hypot(a-x, b-y) > 40; })) pris.push(v);
      if (pris.length===4) break; }
    const v = pick(pris), L = ["A","B","C","D"];
    const marques = pris.map((w,i) => { const [x,y] = MONDE.P[w];
      return `<circle cx="${x}" cy="${y}" r="8" fill="#33415C" stroke="#fff" stroke-width="2"/><text x="${x+11}" y="${y-10}" font-size="42" font-weight="700" font-family="system-ui" fill="#C0392B" stroke="#fff" stroke-width="6" paint-order="stroke">${L[i]}</text>`; }).join("");
    return {kind:"qcm", consigne:`Où se trouve ${v} ?`, html:`${esc(v)}${svg(fond(MONDE.d) + marques, "Carte du monde avec 4 points A, B, C, D")}`, choix:L, bonne:L[pris.indexOf(v)], rappel:`${v} : point ${L[pris.indexOf(v)]}`};
  }
  return { carte:() => Math.random() < .5 ? qui() : ou() };
})();
